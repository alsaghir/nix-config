# Runs `nix run .#ci` (ci/default.nix): checks and builds every NixOS and Home Manager
# configuration and uploads what is not on cache.nixos.org to the Backblaze B2 binary cache
# (nixos/core/binary-cache.nix), so hosts download those paths instead of building them.
# Weekly, it also updates flake.lock and commits it to main only after everything built and
# was uploaded. The same command runs locally; this file only bootstraps the runner.
#
# Secrets live in .github/secrets.yaml (sops); the only GitHub secret is SOPS_AGE_KEY,
# the CI age identity (ci_github in .sops.yaml).
name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  schedule:
    - cron: "0 3 * * 6" # Saturday 03:00 UTC
  workflow_dispatch:
    inputs:
      update-lock:
        description: "Update flake.lock and commit it to main"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write # push the updated flake.lock
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      UPDATE_LOCK: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.update-lock) }}
      PUSH_CACHE: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so self.rev (system.configurationRevision) matches a local clone

      - uses: cachix/install-nix-action@v31

      # Private git+https input (ai-rules): Nix fetches it with the git CLI, which reads a
      # read-only fine-grained token (`ai_rules_token`, Contents: read on ai-rules) from
      # .github/secrets.yaml, via sops from the locked nixpkgs (the flake itself cannot be
      # evaluated before this). Ephemeral runner: the token file dies with it.
      - name: GitHub token for private inputs
        run: |
          rev=$(jq -r '.nodes[.nodes.root.inputs.nixpkgs].locked.rev' flake.lock)
          token=$(nix shell "github:NixOS/nixpkgs/$rev#sops" -c \
            sops decrypt --extract '["ai_rules_token"]' .github/secrets.yaml)
          echo "::add-mask::$token"
          ( umask 077; printf 'https://x-access-token:%s@github.com\n' "$token" > ~/.git-credentials )
          git config --global credential.https://github.com.helper store

      - name: Run ci
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=()
          if [ "$UPDATE_LOCK" = true ]; then
            args+=(--update-lock)
          elif [ "$PUSH_CACHE" = true ]; then
            args+=(--push)
          fi
          nix run .#ci -- "${args[@]}"
